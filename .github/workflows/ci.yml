name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # The image must build without the key: it is a runtime secret.
      - run: docker build -t faucet:ci .
      - name: secret scan
        # Every commit reachable from HEAD: 32-byte hex strings (exact-string
        # allowlist for the public dev0 key) and BIP-39 word runs. See
        # scripts/secret-scan.mjs. fetch-depth 0 above makes history available.
        run: node scripts/secret-scan.mjs
